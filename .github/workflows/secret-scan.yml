name: Secret Scan (full tree)

# Why this exists, and why it is not just another gitleaks-action job.
#
#   gitleaks/gitleaks-action@v3 -- used by the per-push `Secrets` job in ci.yml
#   where one exists -- scans the PUSHED COMMIT RANGE on push, and the PR's
#   commits on pull_request. It never looks at the working tree. Anything that
#   is *already committed* is therefore invisible to it until the file happens
#   to be touched again. That is why four repos carried known credentials
#   through four months of green `Secrets` badges (KAN-522).
#
#   `gitleaks detect --no-git` scans the files on disk instead, so it sees
#   everything that is committed right now. `--no-git` is the load-bearing flag.
#
# KAN-521 (39 of 68 repos had no secret scanning at all) / KAN-522.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:

# Declared explicitly rather than inherited from the repo default (KAN-442).
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-tree:
    name: Full-tree secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read        # actions/checkout only -- gitleaks uses no token
    steps:
      - uses: actions/checkout@v7

      # Pinned, not :latest. A moving scanner version silently changes what the
      # gate enforces; v8.30.1 is the version the KAN-521 baseline sweep ran on.
      # --redact keeps finding values out of the CI log and the SARIF artifact.
      - name: gitleaks detect --no-git (full working tree)
        run: |
          docker run --rm -v "$PWD:/scan" zricethezav/gitleaks:v8.30.1 \
            detect --no-git --source /scan \
            --config /scan/.gitleaks.toml \
            --redact \
            --report-format sarif --report-path /scan/gitleaks.sarif \
            --verbose

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
