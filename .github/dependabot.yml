# Dependabot version updates.
#
# Added under KAN-614. Before that ticket this repository -- like all 96 others
# on the account -- had Dependabot *detection* switched on and no configuration
# at all, so alerts collected in the Security tab and no pull request was ever
# opened. Nothing routed a finding to a person.
#
# Generated by `scripts/generate_dependabot_configs.py` in the egav-docs
# monorepo. Edit it there and regenerate, or delete this header and take
# ownership of this copy by hand -- the generator leaves modified files alone
# and reports them rather than overwriting.
#
# Grouping: minor and patch bumps arrive as ONE pull request per ecosystem per
# week. Major bumps are deliberately left ungrouped so each gets its own
# reviewable pull request.
#
# Scope: this covers *version* updates only. Dependabot *security* updates are a
# separate repository setting, and GitHub auto-pauses them on repositories where
# nobody has interacted with a Dependabot pull request for a while. The
# `dependabot-alert-watch` workflow in egav-docs reports that paused state --
# it was paused on 11 repositories when this file was written.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
